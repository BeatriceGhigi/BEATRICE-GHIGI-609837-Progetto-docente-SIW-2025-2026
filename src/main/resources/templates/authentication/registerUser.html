<!DOCTYPE html>
<html>

<head>
	<title>
		SiwMovie - Registrazione
	</title>
	<link rel="stylesheet" href="/css/stile.css" />
</head>

<body>
	<header>
		<div th:if="${utenteDetails}">
			<span th:text="${utenteDetails.username}"></span>
			<form th:action="@{/logout}" method="POST" style="display:inline;">
				<button type="submit">Logout</button>
			</form>
		</div>
		<div th:unless="${utenteDetails}">
			<a href="/login">Login</a>
		</div>
	</header>


	<h1>Registrazione nuovo utente</h1>
	<form th:action="@{/register}" method="POST" th:object="${utente}">
		<div>
			<label>Username</label>
			<span>
				<input type="text" placeholder="username" required th:field="*{username}" />
			</span>
			<span th:if="${#fields.hasErrors('username')}" th:errors="*{username}"
				th:style="'color:red'">
			</span>
		</div>
		<div>
			<label>Password</label>
			<span><input type="password" placeholder="password" required th:field="*{password}" />
			</span>
			<span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"
				th:style="'color:red'">
			</span>
		</div>
		<div>
			<button type="submit">Registra</button>
		</div>
	</form>
</body>

</html>
