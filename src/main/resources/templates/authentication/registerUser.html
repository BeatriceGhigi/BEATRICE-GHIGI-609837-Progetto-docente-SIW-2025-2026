<!DOCTYPE html>
<html>

<head>
	<title>
		SiwMovie - Registrazione
	</title>
	<link rel="stylesheet" href="/css/stile.css" />
</head>

<body>
	<header>
		<div th:if="${userDetails}">
			<span th:text="${userDetails.username}"></span>
			<form th:action="@{/logout}" method="POST" style="display:inline;">
				<button type="submit">Logout</button>
			</form>
		</div>
		<div th:unless="${userDetails}">
			<a href="/login">Login</a>
		</div>
	</header>

	<h1>Registrazione nuovo utente</h1>
	<form th:action="@{/register}" method="POST">
		<div>
			<label>Username</label>
			<span><input type="text" placeholder="username" required th:field="${utente.username}" /></span>
			<span th:if="${#fields.hasErrors('utente.username')}" th:errors="${utente.username}" th:style="'color:red'">
			</span>
		</div>
		<div>
			<label>Password</label>
			<span><input type="text" placeholder="password" required th:field="${utente.password}" /></span>
			<span th:if="${#fields.hasErrors('utente.password')}" th:errors="${utente.password}" th:style="'color:red'">
			</span>
		</div>
		<div>
			<button type="submit">Registra</button>
		</div>
	</form>
</body>

</html>
