<!DOCTYPE html>
<html>

<head>
	<title>Crea un nuovo torneo</title>
</head>

<body>
	<h1> Aggiungi torneo</h1>
	<form th:action="@{/tornei}" method="POST" th:object="${torneo}">
		<div th:if="${#fields.hasGlobalErrors()}">
			  <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"> </p> 
			  </div>
		<div>
			Nome: <input type="text" th:field="*{nome}"/>
			<span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
		</div>
		<div>
			Anno: <input type="text" th:field="*{anno}" />
			<span th:if="${#fields.hasErrors('anno')}" th:errors="*{anno}"></span>
		</div>
		<div>
			Descrizione: <input type="text" th:field="*{descrizione}" />
		</div>
		<div>
			
		<div>
			<button type="submit" >Conferma</button>
		</div>

	</form>
	
</body>

</html>
