<!DOCTYPE html>
<html>

<head>
	<title>

		Tornei
	</title>
</head>

<body>
	<h1>Lista tornei </h1>
	<div>
		<ul>
			<li th:each="torneo : ${tornei}">
				<a th:href="@{'/tornei/'+ ${torneo.id}}" th:text="${torneo.nome}">Nome </a>

			</li>
		</ul>
	</div>
	<h2>
	    <a th:href="@{/tornei/new}">Inserisci un nuovo torneo</a>
	</h2>
</body>





</html>
