<!DOCTYPE html>
<html style="background-color: lightsteelblue">

<head>
	<link rel="stylesheet" href="/css/stile2.css" />
	<title>Squadre</title>
</head>

<body>
	<h1 th:text="${squadra.nome}">Nome squadra </h1>
	<div style="color: darkslategrey; font-family: monospace; font-size: 15px;"> Anno di fondazione: <span th:text="${squadra.annoFondazione}"> 1800</span>
	</div>
	 <div style="color: darkslategrey; font-family: monospace; font-size: 15px;">
		Città: <span th:text="${squadra.città}"> città </span>
	</div>
	
	<h3 style="color: crimson;">Giocatori</h3>
	<ul th:if="${not #lists.isEmpty(squadra.giocatori)}">
		<li style="color: darkslategrey; font-family: monospace; font-size: 15px;" th:each="giocatore : ${squadra.giocatori}">
			<a th:href="@{/giocatori/{id}(id=${giocatore.id})}" th:text="${giocatore.nome}+ ' ' + ${giocatore.cognome}">Nome
				Cognome</a>
		</li>
	</ul>
	
	<p th:if="${#lists.isEmpty(squadra.giocatori)}">Nessun giocatore presente.</p>

	<h3 style="color: crimson">Partite giocate</h3>
	<ul th:if="${not #lists.isEmpty(partite)}">
	    <li style="color: darkslategrey; font-family: monospace; font-size: 15px;" th:each="partita : ${partite}">
	       <span th:text="${partita.squadraCasa.nome} + ' '+ ${partita.squadraOspite.nome}"></span>
	    </li>
	</ul>
	
	<p th:if="${#lists.isEmpty(partite)}">Nessuna partita giocata.</p>
	

	<a style="color: red; font-family: monospace;" th:href="@{/squadre}">Torna alla lista delle squadre</a>

</body>

</html>
