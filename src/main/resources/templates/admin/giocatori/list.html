<!DOCTYPE html>
<html>

<head>
	<title>

		Giocatori
	</title>
</head>	
	<body>
	<h1>Lista giocatori</h1>
		<div>
			<ul>
				<li th:each="giocatore: ${giocatori}">
					<a th:href="@{'/admin/giocatori/'+ ${giocatore.id}}" th:text="${giocatore.nome} + '' + ${giocatore.cognome}"> Nome</a>
					-------<a th:href="@{/admin/giocatori/{id}/edit(id=${giocatore.id})}">Modifica</a>
				</li>
			</ul>
		</div>
		<a th:href="@{/}">Home</a>
	</body>
</html>
